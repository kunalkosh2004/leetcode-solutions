<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #22c55e;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.connected {
      background: #16a34a22;
      border: 1px solid #22c55e;
    }
    .status.disconnected {
      background: #dc262622;
      border: 1px solid #ef4444;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status.connected .status-dot { background: #22c55e; }
    .status.disconnected .status-dot { background: #ef4444; }
    .instructions {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }
    .instructions code {
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-primary {
      background: #22c55e;
      color: #000;
    }
    .btn-primary:hover {
      background: #16a34a;
    }
    .btn-secondary {
      background: #333;
      color: #eee;
    }
    .btn-secondary:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ leetcode-sync</h1>
  </div>

  <div id="status" class="status disconnected">
    <span class="status-dot"></span>
    <span id="status-text">Checking server...</span>
  </div>

  <div class="instructions">
    <p><strong>Setup:</strong></p>
    <p>1. Run in terminal:<br><code>leetcode-sync serve</code></p>
    <p>2. Solve problems on LeetCode</p>
    <p>3. Submissions sync automatically! 🎉</p>
  </div>

  <button class="btn btn-primary" id="check-btn">Check Connection</button>
  <button class="btn btn-secondary" id="sync-btn">Force Sync</button>

  <script src="popup.js"></script>
</body>
</html>
